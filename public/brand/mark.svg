<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="g" x1="20" y1="1" x2="20" y2="39" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#F0B464"/>
      <stop offset="42%"  stop-color="#E85840"/>
      <stop offset="100%" stop-color="#C23828"/>
    </linearGradient>
  </defs>
  <!--
    4-pointed sparkle — quadratic bezier, inner radius r≈6
    Center (20,20). Outer tips: N(20,1) E(39,20) S(20,39) W(1,20)
    Concave control points at 45° with r=6: (24.24,15.76) etc.
  -->
  <path
    d="M20,1 Q24.24,15.76 39,20 Q24.24,24.24 20,39 Q15.76,24.24 1,20 Q15.76,15.76 20,1 Z"
    fill="url(#g)"
  />
</svg>
