name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Lint, Type Check & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Guardrail de voz (015): gate explícito e obrigatório. Trava regressão das regras anti-IA e do
      # schema sempre que um prompt do bloco de conteúdo mudar. Determinístico, sem chamada de IA
      # (asserções sobre o ruleset + fixtures mockadas), então sem custo e sem flakiness. Roda à parte
      # do `npm test` de propósito: mesmo que a suíte geral fosse pulada, o guardrail de voz não é.
      - name: Golden set (guardrail de voz)
        run: npx vitest run src/lib/ai/content/__tests__/goldenSet.test.ts src/lib/ai/content/__tests__/validateRuleset.test.ts

      - name: Tests
        run: npm test --if-present

      - name: Build
        run: npm run build
        env:
          # Variáveis fake para o build não quebrar sem .env
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          ANTHROPIC_API_KEY: placeholder
